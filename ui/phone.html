<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=430, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>关于本机</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <div class="ios-screen" id="ios-screen">
    <div class="top-chrome" id="top-chrome">
      <div class="status-bar" aria-label="状态栏">
        <span class="status-time">9:41</span>
        <span class="status-icons">
          <span class="status-cellular" role="img" aria-label="蜂窝信号"><i></i><i></i><i></i><i></i></span>
          <span class="status-wifi" role="img" aria-label="Wi-Fi"><i></i></span>
          <span class="status-battery" role="img" aria-label="电池"><i></i></span>
        </span>
      </div>
      <header class="navigation-bar">
        <button class="back-glass" id="phone-back" aria-label="返回设置"><svg viewBox="0 0 24 24"><path d="M15 3 6 12l9 9"/></svg></button>
        <h1 id="page-title">关于本机</h1>
      </header>
      <canvas id="phone-glass-canvas" aria-hidden="true"></canvas>
    </div>
    <main class="phone-scroll" id="phone-scroll"><div id="phone-content"></div></main>
    <div class="phone-scrollbar" id="phone-scrollbar" aria-hidden="true"><span></span></div>
    <div class="app-indicator" id="app-indicator" aria-hidden="true"></div>
    <div class="phone-toast" id="phone-toast" role="status"></div>
  </div>
  <script src="phone.js"></script>
  <script src="phone-glass.js"></script>
</body>
</html>
